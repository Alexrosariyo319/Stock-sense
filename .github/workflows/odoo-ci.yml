name: Odoo Module CI

on:
  push:
    branches: [ main, add-stocksense-ims-backend ]
  pull_request:
    branches: [ main ]

jobs:
  test-odoo-module:
    runs-on: ubuntu-latest

    services:name: Odoo Module CI

on:
  push:
    branches: [ main, add-stocksense-ims-backend ]
  pull_request:
    branches: [ main ]

jobs:
  test-odoo-module:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    container:
      image: odoo:17.0
      options: --user root

    steps:
      - name: Checkout StockSense Repository
        uses: actions/checkout@v4

      - name: Install and Test StockSense Module
        run: |
          odoo \
            -d test_db \
            --db_user=odoo \
            --db_password=odoo_password \
            --db_host=postgres \
            --addons-path="/usr/lib/python3/dist-packages/odoo/addons,custom_addons" \
            -i stocksense \
            --test-enable \
            --stop-after-init
            
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout StockSense Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libldap2-dev libsasl2-dev libpq-dev wkhtmltopdf

      - name: Clone Odoo Core (v17.0)
        run: |
          git clone --depth 1 --branch 17.0 https://github.com/odoo/odoo.git $HOME/odoo

      - name: Install Odoo Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r $HOME/odoo/requirements.txt
          pip install psycopg2-binary

      - name: Install and Test StockSense Module
        env:
          PGHOST: localhost
          PGUSER: odoo
          PGPASSWORD: odoo_password
          PGPORT: 5432
        run: |
          python3 $HOME/odoo/odoo-bin \
            -d test_db \
            --db_user=odoo \
            --db_password=odoo_password \
            --db_host=localhost \
            --addons-path="$HOME/odoo/addons,custom_addons" \
            -i stocksense \
            --test-enable \
            --stop-after-init
